version: "3.8"

services:
  api:
    build: .
    container_name: rag_assistant_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/users.db
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - sqlite_data:/app/data
    depends_on:
      - qdrant
    restart: always


  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

volumes:
  sqlite_data:
  qdrant_data: